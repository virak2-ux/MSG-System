<style>
  :root{
    --ink:#17261f;
    --muted:#64736c;
    --line:#e2e9e5;
    --line-strong:#d1ddd7;
    --bg:#f2f6f3;
    --card:#ffffff;
    --accent:#15705a;
    --accent-2:#209174;
    --accent-dark:#0b493b;
    --accent-soft:#e6f4ef;
    --gold:#d5a331;
    --gold-soft:#fff7df;
    --warn:#9a6500;
    --danger:#b23a33;
    --danger-soft:#fcedeb;
    --ok:#15705a;
    --shadow-sm:0 2px 8px rgba(14,55,43,.06);
    --shadow:0 12px 32px rgba(14,55,43,.10);
    --radius:14px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    background:
      radial-gradient(circle at 92% 3%,rgba(213,163,49,.12),transparent 24rem),
      radial-gradient(circle at 3% 18%,rgba(32,145,116,.09),transparent 28rem),
      var(--bg);
    font-family:'Noto Sans Khmer','Segoe UI',Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  header{
    position:relative;
    overflow:hidden;
    min-height:104px;
    padding:22px clamp(18px,4vw,52px);
    color:#fff;
    background:
      linear-gradient(118deg,rgba(255,255,255,.04),transparent 34%),
      linear-gradient(135deg,var(--accent-dark),#11634f 62%,#1a7b62);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    box-shadow:0 10px 30px rgba(8,53,42,.18);
  }
  header::after{
    content:'';
    position:absolute;
    width:250px;
    height:250px;
    right:-70px;
    top:-130px;
    border:42px solid rgba(255,255,255,.06);
    border-radius:50%;
    pointer-events:none;
  }
  header>div:first-child{position:relative;padding-left:54px;z-index:1;}
  header>div:first-child::before{
    content:'៛';
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    color:var(--accent-dark);
    background:linear-gradient(145deg,#fff6d8,#e9bd55);
    border-radius:12px;
    font-size:21px;
    font-weight:800;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  header h1{
    margin:0;
    font-size:clamp(19px,2.3vw,27px);
    line-height:1.2;
    font-weight:750;
    letter-spacing:-.02em;
  }
  header .sub{margin-top:5px;font-size:12px;opacity:.78;letter-spacing:.06em;text-transform:uppercase;}
  #headerUser{
    position:relative;
    z-index:1;
    min-height:32px;
    padding:7px 12px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:999px;
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(8px);
  }
  #headerUser:empty{display:none;}

  nav{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    gap:5px;
    padding:8px clamp(12px,3vw,36px);
    overflow-x:auto;
    scrollbar-width:none;
    background:rgba(255,255,255,.94);
    border-bottom:1px solid rgba(209,221,215,.9);
    box-shadow:0 4px 18px rgba(14,55,43,.06);
    backdrop-filter:blur(14px);
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    position:relative;
    flex:0 0 auto;
    min-height:40px;
    padding:9px 14px;
    border:0;
    border-radius:10px;
    color:var(--muted);
    background:transparent;
    font-family:inherit;
    font-size:12.5px;
    font-weight:650;
    white-space:nowrap;
    cursor:pointer;
    transition:color .2s ease,background .2s ease,transform .2s ease;
  }
  nav button:hover{color:var(--accent-dark);background:var(--accent-soft);transform:translateY(-1px);}
  nav button.active{
    color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 5px 13px rgba(21,112,90,.22);
  }

  main{width:min(1240px,calc(100% - 28px));margin:0 auto;padding:24px 0 48px;}
  .view{display:none;animation:fadeIn .22s ease both;}
  .view.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .section-title{
    display:flex;
    align-items:center;
    gap:9px;
    margin:27px 0 11px;
    color:var(--accent-dark);
    font-size:15px;
    font-weight:780;
    letter-spacing:-.01em;
  }
  .section-title::before{
    content:'';
    width:5px;
    height:20px;
    border-radius:6px;
    background:linear-gradient(var(--gold),#efc969);
    box-shadow:0 2px 7px rgba(213,163,49,.3);
  }
  .view>.section-title:first-child{margin-top:4px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(205px,1fr));
    gap:14px;
    margin-bottom:22px;
  }
  .card{
    position:relative;
    overflow:hidden;
    padding:17px 18px;
    border:1px solid rgba(209,221,215,.88);
    border-radius:var(--radius);
    background:rgba(255,255,255,.96);
    box-shadow:var(--shadow-sm);
    transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:#bfd3ca;box-shadow:var(--shadow);}
  .kpi::after{
    content:'';
    position:absolute;
    width:72px;
    height:72px;
    right:-28px;
    bottom:-35px;
    border-radius:50%;
    background:var(--accent-soft);
  }
  .kpi .label{
    color:var(--muted);
    font-size:10.5px;
    font-weight:750;
    letter-spacing:.075em;
    text-transform:uppercase;
  }
  .kpi .value{
    margin-top:6px;
    color:var(--accent-dark);
    font-size:clamp(22px,2.5vw,30px);
    line-height:1.15;
    font-weight:790;
    letter-spacing:-.035em;
  }

  form.inline{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
    gap:15px;
    align-items:end;
    padding:18px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:rgba(255,255,255,.95);
    box-shadow:var(--shadow-sm);
  }
  label{
    display:block;
    margin-bottom:6px;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    letter-spacing:.025em;
  }
  input,select,textarea{
    width:100%;
    min-height:40px;
    padding:9px 11px;
    border:1px solid var(--line-strong);
    border-radius:9px;
    outline:none;
    color:var(--ink);
    background:#fff;
    font:inherit;
    font-size:13px;
    transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
  }
  input::placeholder,textarea::placeholder{color:#9aa7a0;}
  input:hover,select:hover,textarea:hover{border-color:#a9c2b7;}
  input:focus,select:focus,textarea:focus{
    border-color:var(--accent-2);
    box-shadow:0 0 0 3px rgba(32,145,116,.13);
    background:#fcfffe;
  }

  button.btn{
    min-height:40px;
    padding:9px 15px;
    border:0;
    border-radius:9px;
    color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 5px 12px rgba(21,112,90,.18);
    font-family:inherit;
    font-size:12.5px;
    font-weight:750;
    cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
  }
  button.btn:hover{transform:translateY(-1px);filter:saturate(1.1);box-shadow:0 8px 18px rgba(21,112,90,.24);}
  button.btn:active{transform:translateY(0);}
  button.btn.secondary{color:var(--accent-dark);border:1px solid #9fc8b8;background:#fff;box-shadow:none;}
  button.btn.secondary:hover{background:var(--accent-soft);}
  button.btn.small{min-height:30px;padding:5px 10px;border-radius:7px;font-size:11px;}
  button.btn.danger{background:linear-gradient(135deg,#a9342e,#c84b43);}

  .toolbar{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin:3px 0 17px;
    padding:13px;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.72);
  }

  .tablewrap{
    position:relative;
    max-height:62vh;
    overflow:auto;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    box-shadow:var(--shadow-sm);
    scrollbar-color:#b7c9c1 transparent;
  }
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;}
  th,td{
    padding:11px 12px;
    border-bottom:1px solid #e9eeeb;
    text-align:left;
    white-space:nowrap;
  }
  th{
    position:sticky;
    top:0;
    z-index:2;
    color:#4d6158;
    background:#f3f7f5;
    font-size:10.5px;
    font-weight:780;
    letter-spacing:.045em;
    text-transform:uppercase;
    box-shadow:0 1px 0 var(--line);
  }
  tbody tr{transition:background .15s ease;}
  tbody tr:hover{background:#f5faf8;}
  tbody tr:last-child td{border-bottom:0;}

  .pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:4px 9px;
    border-radius:999px;
    font-size:10.5px;
    font-weight:750;
  }
  .pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .pill.pending{color:var(--warn);background:var(--gold-soft);}
  .pill.approved,.pill.yes{color:var(--ok);background:var(--accent-soft);}
  .pill.rejected{color:var(--danger);background:var(--danger-soft);}
  .pill.no{color:var(--muted);background:#edf1ef;}

  #flash{position:sticky;top:66px;z-index:30;}
  .msg{
    margin-bottom:14px;
    padding:12px 14px;
    border:1px solid transparent;
    border-radius:10px;
    font-size:12.5px;
    font-weight:650;
    box-shadow:var(--shadow-sm);
  }
  .msg.ok{color:var(--accent-dark);border-color:#bfe0d3;background:#e6f5ef;}
  .msg.err{color:#8f2d28;border-color:#efc8c4;background:var(--danger-soft);}
  .empty{padding:20px;color:var(--muted);font-size:12.5px;text-align:center;}
  .muted{color:var(--muted);}

  @media (max-width:720px){
    header{min-height:88px;padding:17px 18px;}
    header>div:first-child{padding-left:47px;}
    header>div:first-child::before{width:36px;height:36px;border-radius:10px;}
    header h1{font-size:18px;}
    nav{padding:7px 10px;}
    nav button{min-height:38px;padding:8px 11px;font-size:11.5px;}
    main{width:min(100% - 20px,1240px);padding-top:18px;}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .card{padding:14px;}
    .kpi .label{font-size:9.5px;}
    .kpi .value{font-size:21px;}
    form.inline{grid-template-columns:1fr;padding:14px;gap:12px;}
    .section-title{margin-top:22px;}
    th,td{padding:9px 10px;}
    .toolbar button.btn{flex:1 1 160px;}
  }
  @media (max-width:430px){
    .grid{grid-template-columns:1fr;}
    header .sub{font-size:10px;}
    #headerUser{width:100%;}
  }

  .history-hero{
    display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    margin:2px 0 18px;padding:20px 22px;border:1px solid #bfd8ce;border-radius:var(--radius);
    background:linear-gradient(135deg,#f9fffc,#edf8f3);box-shadow:var(--shadow-sm);
  }
  .history-hero h2{margin:3px 0 5px;color:var(--accent-dark);font-size:21px;letter-spacing:-.025em;}
  .history-hero p{max-width:720px;margin:0;color:var(--muted);font-size:12.5px;}
  .history-eyebrow{color:var(--gold);font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;}
  .source-switch{display:flex;gap:8px;flex-wrap:wrap;}
  .source-switch .btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:0;}
  .history-stats{grid-template-columns:repeat(4,minmax(155px,1fr));}
  .history-helper{position:relative;z-index:1;margin-top:6px;color:var(--muted);font-size:10.5px;}
  .history-filters{
    display:grid;grid-template-columns:minmax(240px,2fr) minmax(170px,1fr) auto;gap:12px;align-items:end;
    margin:18px 0 12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;
  }
  .history-count{padding:10px 3px;color:var(--accent-dark);font-size:11.5px;font-weight:750;white-space:nowrap;}
  .history-note{margin:0 0 10px;color:var(--muted);font-size:11px;}
  .history-table{max-height:66vh;}
  .history-table td:nth-child(3){white-space:normal;min-width:270px;}
  @media(max-width:720px){
    .history-stats{grid-template-columns:repeat(2,minmax(0,1fr));}
    .history-filters{grid-template-columns:1fr;}
    .history-count{padding:0;}
    .source-switch{width:100%;}
    .source-switch .btn{flex:1;}
  }

</style>
